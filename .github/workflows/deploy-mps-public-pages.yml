name: Deploy MPS public website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public website
        run: |
          set -euo pipefail
          mkdir -p _site
          cp ./*.html config.js manifest.webmanifest sw.js _site/
          cp -R assets css js _site/
          test -d prototypes/mps-discipline-x
          mkdir -p _site/prototypes
          cp -R prototypes/mps-discipline-x _site/prototypes/
          test -d prototypes/mps-trading-journal
          cp -R prototypes/mps-trading-journal _site/prototypes/
          test -d prototypes/mps-trading-calculator
          cp -R prototypes/mps-trading-calculator _site/prototypes/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/prototypes/mps-discipline-x/index.html
          test -s _site/prototypes/mps-trading-journal/index.html
          test -s _site/prototypes/mps-trading-calculator/index.html
          grep -q 'id="mps-global-sessions"' _site/index.html
          test -s _site/assets/logo.svg
          echo "Built public site with MPS global session clocks and Discipline X preview."
          echo "test -s _site/prototypes/mps-trading-journal/index.html
          echo "Built public site with MPS global session clocks, Discipline X, and separate Trading Journal preview."
          echo "Static files: $(find _site -type f | wc -l)""

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
