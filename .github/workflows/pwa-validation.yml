name: MPS PWA validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/**', 'mps-v4.8-workbench']

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate PWA files and privacy rules
        run: node scripts/validate-pwa.mjs
      - name: Run synthetic database schema compatibility tests
        run: node scripts/test-schema-compatibility.mjs
      - name: Run official draw synthetic security contract
        env:
          MPS_DRAW_TEST_ALLOW_LOCAL: "1"
          MPS_DRAW_TEST_ADAPTER: "./tests/official-draw/local-sandbox-adapter.mjs"
        run: node --test tests/official-draw/security-contract.test.mjs
      - name: Run durable synthetic audit journal fault-injection tests
        run: node --test tests/official-draw/durable-audit-journal.test.mjs
      - name: Run read-only schema inspector tests
        run: node scripts/test-readonly-schema-inspector.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run Chromium browser checks
        run: node scripts/test-pwa-browser.mjs
