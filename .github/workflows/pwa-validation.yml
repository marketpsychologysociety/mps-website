name: MPS PWA validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/**', 'mps-v4.8-workbench']

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate PWA files and privacy rules
        run: node scripts/validate-pwa.mjs
      - name: Run synthetic database schema compatibility tests
        run: node scripts/test-schema-compatibility.mjs
      - name: Run P1.23 isolated technical acceptance harness (synthetic only)
        run: node --test tests/official-draw/isolated-acceptance-harness.test.mjs
      - name: Run P1.24 SQLite transactional persistence tests (synthetic only)
        run: node --test tests/official-draw/sqlite-transactional-store.test.mjs
      - name: Run P1.25 SQLite cross-process contention and crash-recovery tests (synthetic only)
        run: node --test tests/official-draw/sqlite-process-contention.test.mjs
      - name: Run P1.26 SQLite operational boundary tests (synthetic only)
        run: node --test tests/official-draw/sqlite-operational-boundaries.test.mjs
      - name: Run P1.27 SQLite failure-containment tests (synthetic only)
        run: node --test tests/official-draw/sqlite-failure-containment.test.mjs
      - name: Run P1.28 verified SQLite restore tests (synthetic only)
        run: node --test tests/official-draw/sqlite-verified-restore.test.mjs
      - name: Run P1.29 end-to-end SQLite recovery drill tests (synthetic only)
        run: node --test tests/official-draw/sqlite-recovery-drill.test.mjs
      - name: Run P1.30 signed recovery-checkpoint attestation tests (synthetic only)
        run: node --test tests/official-draw/recovery-checkpoint-attestation.test.mjs
      - name: Run official draw synthetic security contract
        env:
          MPS_DRAW_TEST_ALLOW_LOCAL: "1"
          MPS_DRAW_TEST_ADAPTER: "./tests/official-draw/local-sandbox-adapter.mjs"
        run: node --test tests/official-draw/security-contract.test.mjs
      - name: Run durable synthetic audit journal fault-injection tests
        run: node --test tests/official-draw/durable-audit-journal.test.mjs
      - name: Run synthetic external journal-anchor contract tests
        run: node --test tests/official-draw/synthetic-external-anchor.test.mjs
      - name: Run offline GCS PoC evidence-bundle verifier tests
        run: node --test tests/official-draw/gcs-poc-evidence-verifier.test.mjs
      - name: Run offline raw GCS audit normalization tests
        run: node --test tests/official-draw/gcs-raw-audit-normalizer.test.mjs
      - name: Run offline GCS evidence provenance attestation tests
        run: node --test tests/official-draw/gcs-evidence-provenance-verifier.test.mjs
      - name: Run durable reviewer trust registry and single-use nonce tests
        run: node --test tests/official-draw/durable-reviewer-trust-registry.test.mjs
      - name: Run synthetic independent backup and restore verification tests
        run: node --test tests/official-draw/synthetic-backup-recovery.test.mjs
      - name: Run off-site recovery drill evidence contract tests
        run: node --test tests/official-draw/offsite-recovery-drill-contract.test.mjs
      - name: Run synthetic backup readiness monitoring and notification outbox tests
        run: node --test tests/official-draw/backup-readiness-monitor.test.mjs
      - name: Run persistent Draw API process-restart and reconciliation tests
        run: node --test tests/official-draw/persistent-api-integration.test.mjs
      - name: Run synthetic incident tabletop decision evaluator tests
        run: node --test tests/official-draw/tabletop-exercise.test.mjs
      - name: Run read-only schema inspector tests
        run: node scripts/test-readonly-schema-inspector.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run Chromium browser checks
        run: node scripts/test-pwa-browser.mjs
