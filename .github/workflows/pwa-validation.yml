name: MPS PWA validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/**', 'mps-v4.8-workbench']

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate PWA files and privacy rules
        run: node scripts/validate-pwa.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run Chromium browser checks
        run: node scripts/test-pwa-browser.mjs
