name: Publish MPS v4.8 isolated preview

on:
  push:
    branches:
      - mps-v4.8-preview-pages
    paths:
      - '.github/workflows/deploy-mps-preview.yml'
      - '*.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mps-v4.8-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
      - name: Assemble static website only
        run: |
          set -euo pipefail
          mkdir -p _site
          cp ./*.html config.js manifest.webmanifest sw.js _site/
          cp -R assets css js _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/css/style.css
          test -s _site/js/main.js
          echo "Static preview files: $(find _site -type f | wc -l)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
