name: MPS PWA validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'integration/**']

permissions:
  contents: read

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate PWA files and privacy rules
        run: node scripts/validate-pwa.mjs
